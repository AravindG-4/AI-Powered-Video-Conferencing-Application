<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zoom Clone with Emotion Detection</title>
  <style>
    #video-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
    }
    .video-wrapper {
      position: relative;
      width: 300px;
      height: 200px;
    }
    video {
      width: 100%;
      height: 100%;
      background: black;
    }
    .emotion-label {
      position: absolute;
      bottom: 5px;
      left: 5px;
      background: rgba(0, 0, 0, 0.7);
      color: white;
      padding: 5px;
      border-radius: 3px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <h1>Zoom Clone with Emotion Detection</h1>
  <div id="video-container"></div>

  <script>
    const videoContainer = document.getElementById("video-container");
    const ws = new WebSocket("ws://169.254.221.91:8080/ws/room1"); // Replace <SERVER_IP> with your server's IP

    const peers = {};
    const config = { iceServers: [{ urls: "stun:stun.l.google.com:19302" }] };

    navigator.mediaDevices.getUserMedia({ video: true, audio: true }).then((stream) => {
      const localVideo = createVideoElement("You");
      localVideo.video.srcObject = stream;

      ws.onopen = () => {
        setInterval(() => {
          const canvas = document.createElement("canvas");
          canvas.width = localVideo.video.videoWidth;
          canvas.height = localVideo.video.videoHeight;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(localVideo.video, 0, 0, canvas.width, canvas.height);

          canvas.toBlob((blob) => {
            const reader = new FileReader();
            reader.readAsDataURL(blob);
            reader.onloadend = () => {
              const base64data = reader.result.split(",")[1];
              ws.send(base64data);
            };
          }, "image/jpeg");
        }, 500);
      };

      ws.onmessage = (message) => {
        const [participantId, emotion] = message.data.split(": ");
        if (peers[participantId]) {
          peers[participantId].label.textContent = emotion;
        } else {
          const newVideo = createVideoElement(participantId);
          peers[participantId] = newVideo;
        }
      };
    });

    function createVideoElement(label) {
      const wrapper = document.createElement("div");
      wrapper.classList.add("video-wrapper");

      const video = document.createElement("video");
      video.autoplay = true;
      wrapper.appendChild(video);

      const emotionLabel = document.createElement("div");
      emotionLabel.classList.add("emotion-label");
      emotionLabel.textContent = "Loading...";
      wrapper.appendChild(emotionLabel);

      videoContainer.appendChild(wrapper);
      return { wrapper, video, label: emotionLabel };
    }
  </script>
</body>
</html>
